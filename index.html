<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf8ef"><title>Мини Игры — тетрадь</title><link rel="stylesheet" href="style.css?v=3"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main class="sheet"><header><div class="brand">✎ Мини Игры</div><div class="subtitle">тетрадь в клеточку · выпуск №1</div></header><section id="home" class="screen"><h1>Во что сыграем?</h1><button class="game-card" id="open2048"><span class="card-icon">2ⁿ</span><span><strong>2048</strong><small>Соединяй одинаковые числа и доберись до 2048!</small></span><span class="arrow">↗</span></button><p class="footnote">Другие игры появятся на следующих страницах тетради...</p></section><section id="game" class="screen hidden"><div class="toolbar"><button id="back" class="text-btn">← К играм</button><button id="sound" class="text-btn" aria-label="Включить или выключить звук">♪ выкл.</button></div><h1 class="game-title">2048</h1><div class="scorebar"><div class="score"><span>СЧЁТ</span><strong id="score">0</strong></div><div class="score"><span>РЕКОРД</span><strong id="best">0</strong></div><button id="restart" class="restart">↻ Заново</button></div><p class="instructions">Проведи пальцем или используй стрелки на клавиатуре.</p><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Игровое поле 2048"></div><div id="overlay" class="overlay hidden"><div class="overlay-paper"><h2 id="overlay-title">2048!</h2><p id="overlay-text">Ура!</p><button id="continue" class="restart">Продолжить</button><button id="retry" class="restart">Ещё раз</button></div></div></div><p class="hint">Одинаковые числа складываются: 2 + 2 = 4</p><div class="controls"><button data-dir="left" aria-label="Влево">←</button><div><button data-dir="up" aria-label="Вверх">↑</button><button data-dir="down" aria-label="Вниз">↓</button></div><button data-dir="right" aria-label="Вправо">→</button></div><p class="footnote">Нарисовано ручкой на полях тетради</p></section></main><script src="app.js?v=3"></script></body></html>
